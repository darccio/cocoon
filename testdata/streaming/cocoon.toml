[package]
name="streaming"
go_import="dario.cat/cocoon/testdata/streaming/go/streaming"
rust_crate="cocoon-streaming-shim"
[limits]
max_input="64KiB"
max_output="128KiB"
max_memory="16MiB"
instances="1"
[capabilities]
log=true
[[func]]
name="echo"
params=[{name="input",type="bytes"}]
returns="bytes"
[[resource]]
name="Stream"
copy="shared"
checked_batches=true
[[resource.method]]
name="new"
returns="Stream"
[[resource.method]]
name="write"
params=[{name="chunk",type="bytes"}]
returns="bytes"
fallible=true
[[resource.method]]
name="end"
returns="bytes"
fallible=true
[[resource.method]]
name="fault"
params=[{name="kind",type="u32"}]
fallible=true
[[resource.method]]
name="close"
