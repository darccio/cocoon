[package]
name="compute"
go_import="dario.cat/cocoon/testdata/compute/go/compute"
rust_crate="cocoon-compute-shim"
[limits]
max_input="64KiB"
max_output="64KiB"
max_memory="16MiB"
instances="1"
[capabilities]
log=true
[[record]]
name="Numbers"
fields=[{name="signed32",type="i32"},{name="unsigned32",type="u32"},{name="signed64",type="i64"},{name="unsigned64",type="u64"},{name="float32",type="f32"},{name="float64",type="f64"},{name="enabled",type="bool"}]
[[record]]
name="Payload"
fields=[{name="label",type="string"},{name="data",type="bytes"},{name="numbers",type="Numbers"},{name="signed32",type="[]i32"},{name="unsigned32",type="[]u32"},{name="signed64",type="[]i64"},{name="unsigned64",type="[]u64"},{name="float32",type="[]f32"},{name="float64",type="[]f64"}]
[[func]]
name="echo"
params=[{name="input",type="string"}]
returns="string"
fallible=true
[[func]]
name="join"
params=[{name="left",type="string"},{name="right",type="string"}]
returns="string"
[[func]]
name="bounce"
params=[{name="payload",type="Payload"}]
returns="Payload"
[[func]]
name="scalar_values"
params=[{name="a",type="i32"},{name="b",type="u32"},{name="c",type="i64"},{name="d",type="u64"},{name="e",type="f32"},{name="f",type="f64"},{name="enabled",type="bool"}]
returns="Numbers"
[[func]]
name="test_trap"
params=[{name="kind",type="u32"}]
[[resource]]
name="Counter"
copy="shared"
[[resource.method]]
name="new"
params=[{name="start",type="u64"}]
returns="Counter"
[[resource.method]]
name="add"
params=[{name="delta",type="u64"}]
returns="u64"
fallible=true
[[resource.method]]
name="count"
returns="u64"
[[resource.method]]
name="close"
