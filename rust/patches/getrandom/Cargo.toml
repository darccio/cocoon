[package]
name = "getrandom"
version = "0.2.17"
edition = "2024"
publish = false
license.workspace = true
description = "Cocoon-specific entropy adapter for getrandom 0.2 consumers"

[features]
default = []
std = []
js = []
custom = []
rdrand = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
cocoon-guest = { path = "../../cocoon-guest", features = ["random"] }
